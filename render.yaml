# Render Blueprint: https://render.com/docs/blueprint-spec
# In the Render dashboard choose New > Blueprint, pick this repository, and
# Render builds the Dockerfile and keeps the portal online.
services:
  - type: web
    name: circularsync
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # The admin password for uploading and deleting circulars. Render asks
      # you to type it when you create the Blueprint; change it any time under
      # the service's Environment tab (the service restarts with the new one).
      - key: CIRCULARSYNC_ADMIN_PASSWORD
        sync: false
